[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "venture-debt-ai-digest"
version = "0.1.0"
description = "Evidence-first venture debt and AI daily digest worker"
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "email-validator>=2.2,<3",
  "feedparser>=6.0,<7",
  "google-auth>=2.40,<3",
  "gspread>=6.2,<7",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "lxml>=5.4,<7",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "tenacity>=9.1,<10",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.26,<2",
  "pytest-cov>=6.1,<8",
  "respx>=0.22,<1",
  "ruff>=0.11,<1",
]

[project.scripts]
vdai-digest = "vdai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vdai"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]
